
# README cards, see https://github.com/pedrocatalao/github-cool-readme
name: Update README cards

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pedrocatalao/github-cool-readme@v1
        with:
          token: ${{ secrets.CARDS_TOKEN }}
          output: ${{ runner.temp }}/cards

      # Fix invalid XML percentage characters in generated language cards.
      - name: Fix invalid SVG percentage characters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import os

          folder = Path(os.environ["RUNNER_TEMP"]) / "cards"

          for file in folder.glob("languages-*.svg"):
              content = file.read_text(encoding="utf-8")

              fixed = re.sub(
                  r'(<tspan class="secondary">)<(?=\d)',
                  r'\1&lt;',
                  content
              )

              if fixed != content:
                  file.write_text(fixed, encoding="utf-8")
                  print(f"Fixed invalid percentage in {file.name}")
              else:
                  print(f"No correction needed in {file.name}")
          PY

      # Publish cards on their own branch.
      - name: Publish the cards on the cards branch
        run: |
          # If cards are disabled, there is nothing to publish.
          if ! ls "$RUNNER_TEMP"/cards/*.svg >/dev/null 2>&1; then
            echo "No cards: they're off"
            exit 0
          fi

          git fetch --quiet --depth 1 origin cards:refs/remotes/origin/cards 2>/dev/null || true

          git switch --quiet --orphan cards

          cp "$RUNNER_TEMP"/cards/*.svg .

          git add -- *.svg

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git commit --quiet -m 'Update README cards'

          if git rev-parse --quiet --verify origin/cards >/dev/null && git diff --quiet origin/cards HEAD; then
            echo "No changes"
            exit 0
          fi

          git push --force origin cards
